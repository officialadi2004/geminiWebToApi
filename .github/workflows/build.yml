name: Windows companion and MV3 extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: InvisibleAI/BrowserExtension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gemini and lint dependencies (no credentials)
        run: python -m pip install -r InvisibleAI/WindowsCompanion/AI/GeminiWeb/requirements.txt -r InvisibleAI/Scripts/requirements-dev.txt
      - name: Lint, type check, independent provider tests and desktop subsystems
        shell: pwsh
        run: ./InvisibleAI/Scripts/Build.ps1
      - name: Publish production package
        shell: pwsh
        run: ./InvisibleAI/Scripts/Publish.ps1
      - name: Scan tracked source for credential patterns
        run: python InvisibleAI/Scripts/Check-Secrets.py
      - uses: actions/upload-artifact@v4
        with:
          name: InvisibleAI-windows-x64
          path: InvisibleAI/artifacts/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: InvisibleAI-chrome-edge
          path: InvisibleAI/BrowserExtension/dist/
