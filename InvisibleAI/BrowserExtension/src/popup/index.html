<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invisible AI Assistant</title><link rel="stylesheet" href="../styles.css"></head>
<body class="popup"><main>
<div class="eyebrow"><span class="dot"></span> YOUR SCREEN COMES FIRST</div>
<h1>Invisible AI</h1><p class="muted">A quiet assistant. An explicit action.</p>
<div class="status" id="status" role="status">Checking companion…</div>
<button id="ask" class="primary">Ask about selected text <span>↗</span></button>
<button id="connect">Reconnect companion</button>
<button id="desktop">Windows settings</button>
<p class="note">Or copy text normally, then press <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>V</kbd>. Normal copy and paste keep working.</p>
<footer><button id="options" class="link">Extension settings</button><span>WINDOWS + BROWSER</span></footer>
</main><script type="module" src="popup.js"></script></body></html>
